<header class="site-head">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="brand__pixel" aria-hidden="true"></span>
    <span class="brand__name">{{ site.title }}</span>
  </a>

  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
    <span class="nav-toggle__bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="nav-toggle__label">Menu</span>
  </button>

  <nav id="site-nav" class="site-nav" aria-label="Main">
    <ul>
      {%- assign nav = site.data.nav -%}
      {%- for item in nav %}
      <li>
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url or page.nav == item.key %}aria-current="page"{% endif %}>
          <span class="nav-num" aria-hidden="true">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>{{ item.title }}
        </a>
      </li>
      {%- endfor %}
      <li class="site-nav__cta">
        <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" rel="me noopener" target="_blank">
          {% include icon.html name="linkedin" %}LinkedIn
        </a>
      </li>
    </ul>
  </nav>
</header>
