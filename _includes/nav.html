<header class="site-head">
  <div class="site-head__inner wrap wrap--wide">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bars" aria-hidden="true"><i></i><i></i></span>
      <span>Menu</span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main">
      <ul>
        {%- for item in site.data.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.nav == item.key %}aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor %}
        <li>
          <a class="nav-out" href="https://www.linkedin.com/in/{{ site.author.linkedin }}"
             rel="me noopener" target="_blank">
            LinkedIn<span class="nav-out__mark" aria-hidden="true">↗</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
