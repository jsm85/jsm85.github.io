---
layout: base
---
<div class="page-head">
  <div class="wrap">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="display">{{ page.title }}</h1>
    {%- if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
  </div>
</div>

<div class="wrap wrap--narrow prose">
  {{ content }}
</div>
